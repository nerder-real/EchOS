name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号，例如 1.0.0（会用 v1.0.0 作为 Release 标签）'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache-dependency-path: core/go.sum

      # 版本号：push 标签时取 GITHUB_REF_NAME（v1.0.0 → 1.0.0）；
      # 手动触发时取输入框版本号（1.0.0 → 标签 v1.0.0）。
      # 写回 Info.plist，DMG 文件名自动是 EchOS-mac-1.0.0-universal-x64.dmg。
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${GITHUB_REF_NAME#v}"
          else
            TAG="v${{ github.event.inputs.version }}"
            VER="${{ github.event.inputs.version }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VER=$VER" >> "$GITHUB_OUTPUT"
          echo "Building version: $VER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" gui/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" gui/Info.plist

      - name: Fetch geo data
        # geoip.dat / geosite.dat 不进仓库，构建前下载最新版（本地已存在则跳过）
        run: ./fetch-geodata.sh

      - name: Build app
        # ECH_UPDATE_REPO 注入构建产物，DMG 里「检查更新」才能指向本仓库的 Releases
        env:
          ECH_UPDATE_REPO: ${{ github.repository }}
        run: ./build.sh

      - name: Package DMG
        # CI 没有 GUI 会话，跳过 Finder 布局（make-dmg.sh 里 FINDER_LAYOUT=0 会跳过）
        run: FINDER_LAYOUT=0 ./make-dmg.sh

      - name: List artifacts
        run: ls -la build/

      # 改动说明：优先取 CHANGELOG.md 里对应版本的段落（# 号注释的行）
      # 作为正文；没有写就退回 GitHub 自动生成。想人工润色也可以在
      # Release 发布后直接到网页上编辑正文。
      - name: Generate release notes
        run: |
          TAG="${{ steps.ver.outputs.TAG }}"
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            # 提取 "## v1.0.1"（或 "## 1.0.1"）段落，直到下一个 "## " 为止
            NOTES=$(awk -v t="$TAG" -v t2="${TAG#v}" '
              $0 ~ "^## +" (t "|" t2) "$" { insec=1; next }
              insec && $0 ~ "^## " { exit }
              insec { print }
            ' CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            PREV=$(git tag --sort=-version:refname | sed -n '2p')
            if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
              NOTES=$(gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" \
                -f tag_name="$TAG" \
                -f target_commitish="$(git rev-parse HEAD)" \
                -f previous_tag_name="$PREV" \
                --jq '.body')
            else
              NOTES="首次发布，包含完整功能。"
            fi
          fi
          {
            echo "## EchOS $TAG"
            echo ""
            echo "macOS 13.0+，Intel 与 Apple Silicon 通用。"
            echo ""
            echo "- 下载 \`EchOS-mac-*-universal-x64.dmg\` 后拖入 Applications"
            echo "- 无 Apple 开发者签名，首次打开需右键 → 打开（Gatekeeper）"
            echo ""
            echo "$NOTES"
          } > RELEASE_BODY.md

      - name: Create release & upload DMG
        # 由标签触发；GitHub 会自动给每个 Release 附上
        # "Source code (zip)" 和 "Source code (tar.gz)"
        # 手动触发时 tag_name 用输入框版本号拼成的标签（不存在会自动创建）
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: EchOS ${{ steps.ver.outputs.TAG }}
          body_path: RELEASE_BODY.md
          files: EchOS-mac-*.dmg
